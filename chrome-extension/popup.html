<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DSA Tracker Pro</title>
  <style>
    :root {
      --bg: #0e1320; --card: #171e30; --brd: rgba(255,255,255,.09);
      --txt: #e7ecf5; --dim: #8a95ad; --green: #35d07f; --red: #ff6b6b; --orange: #ff9f45;
      --github: #24292e; --github-hover: #2f363d;
    }
    * { box-sizing: border-box; }
    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      width: 350px; margin: 0; padding: 16px;
      background: var(--bg); color: var(--txt);
    }
    .head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .mark {
      width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center;
      font-weight: 800; font-size: 14px; color: #06120b;
      background: linear-gradient(135deg, var(--green), #4fa8ff);
    }
    h2 { margin: 0; font-size: 16.5px; font-weight: 700; }
    .sub { color: var(--dim); font-size: 11px; }

    .status {
      font-size: 12px; padding: 9px 11px; border-radius: 9px;
      background: var(--card); border: 1px solid var(--brd); margin-bottom: 12px;
      display: flex; align-items: center; gap: 8px;
    }
    .status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); flex: none; }
    .status.ok .dot { background: var(--green); box-shadow: 0 0 8px var(--green); }
    .status.err .dot { background: var(--red); }

    .stats {
      display: flex; gap: 8px; margin: 12px 0;
    }
    .stat {
      flex: 1; background: var(--card); border: 1px solid var(--brd);
      border-radius: 10px; padding: 10px; text-align: center;
    }
    .stat b { display: block; font-size: 22px; font-family: "Consolas", monospace; }
    .stat span { font-size: 10.5px; color: var(--dim); }

    label { display: block; margin-top: 10px; font-size: 11.5px; font-weight: 600; color: var(--dim); }
    input[type="text"], input[type="password"] {
      width: 100%; margin-top: 4px; padding: 8px 10px;
      background: #0d1424; color: var(--txt);
      border: 1px solid var(--brd); border-radius: 8px; font-size: 13px;
    }
    input:focus { outline: none; border-color: var(--green); }
    .hint { font-size: 10.5px; color: var(--dim); margin-top: 4px; }
    .hint a { color: var(--green); }

    .row { display: flex; gap: 8px; }
    .row > div { flex: 1; }
    .check { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 12px; cursor: pointer; }
    .check input { width: auto; }

    .actions { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
    .action-row { display: flex; gap: 8px; }

    button {
      width: 100%; padding: 10px 14px; border: 0; border-radius: 9px; cursor: pointer;
      font-weight: 600; font-size: 13px; transition: transform .12s, opacity .12s, background .15s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    button:hover { transform: translateY(-1px); }
    button:disabled { opacity: .5; cursor: default; transform: none; }
    .btn-oauth { background: var(--green); color: #06120b; font-size: 13.5px; font-weight: 700; }
    .btn-pat { background: var(--card); color: var(--txt); border: 1px solid var(--brd); }
    .ghost { background: var(--card); color: var(--txt); border: 1px solid var(--brd); }

    details {
      margin-top: 12px; background: rgba(255,255,255,.02); border: 1px dashed var(--brd);
      border-radius: 8px; padding: 8px 10px; font-size: 11.5px;
    }
    summary { cursor: pointer; color: var(--dim); font-weight: 600; user-select: none; }
    summary:hover { color: var(--txt); }
  </style>
</head>
<body>
  <div class="head">
    <div class="mark">&lt;/&gt;</div>
    <div>
      <h2>DSA Tracker Pro</h2>
      <div class="sub">Auto-commit solutions to GitHub</div>
    </div>
  </div>

  <div class="status" id="status"><span class="dot"></span><span id="statusText">Checking…</span></div>

  <div class="stats">
    <div class="stat"><b id="statPushed">0</b><span>pushed</span></div>
    <div class="stat"><b id="statStreak">0</b><span>day streak 🔥</span></div>
    <div class="stat"><b id="statActive">0</b><span>active days</span></div>
  </div>

  <!-- Primary OAuth Button -->
  <button id="connectOAuth" class="btn-oauth">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
    Connect with GitHub (1-Click)
  </button>

  <div class="row">
    <div>
      <label for="repoName">Target Repo</label>
      <input id="repoName" type="text" placeholder="dsa-solutions" />
    </div>
    <div>
      <label for="branch">Branch</label>
      <input id="branch" type="text" placeholder="main" />
    </div>
  </div>

  <label class="check" for="updateExisting">
    <input id="updateExisting" type="checkbox" />
    Overwrite code when resubmitting a problem
  </label>



  <!-- Collapsible PAT Fallback & OAuth Callback Info -->
  <details>
    <summary>Advanced OAuth Callback Info & PAT Fallback</summary>
    <div style="margin-top: 8px; padding: 6px; background: rgba(0,0,0,0.3); border-radius: 6px; font-size: 10px; word-break: break-all;">
      <b>OAuth Redirect URL:</b><br />
      <span id="redirectUrlText" style="color: var(--green);">Loading…</span>
    </div>
    <label for="githubToken">GitHub Access Token</label>
    <input id="githubToken" type="password" placeholder="github_pat_..." />
    <div class="hint">
      Fine-grained token with <b>Contents: Read and write</b>.
      <a href="https://github.com/settings/tokens?type=beta" target="_blank">Create token →</a>
    </div>
    <button id="connect" class="btn-pat" style="margin-top: 8px;">Verify PAT Token</button>
  </details>

  <div class="actions">
    <button id="dashboard" class="ghost">📊 Open Analytics Dashboard</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
